<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void SuperCode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <span id="title">Void SuperCode</span>
    </div>
    <div id="main">
      <div id="sidebar">
        <div id="sidebar-header">
          <span>Explorer</span>
          <div id="sidebar-actions">
            <button id="new-file-btn" title="New File">
              <img src="icons/new-file.svg" alt="New File" />
            </button>
            <button id="open-folder-btn" title="Open Folder">
              <img src="icons/folder.svg" alt="Open Folder" />
            </button>
          </div>
        </div>
        <div id="file-tree">
          <div class="tree-empty">Open a folder to start</div>
        </div>
      </div>
      <div id="editor"></div>
    </div>
  </div>

  <script src="vs/loader.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/file-explorer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
