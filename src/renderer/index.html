<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void SuperCode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <span id="title">Void SuperCode</span>
    </div>
    <div id="editor"></div>
  </div>

  <script>
    self.MonacoEnvironment = {
      getWorkerUrl: function () {
        const workerUrl = new URL('vs/base/worker/workerMain.js', location.href).href;
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
          self.MonacoEnvironment = { baseUrl: '${new URL('vs', location.href).href}' };
          importScripts('${workerUrl}');
        `)}`;
      }
    };
  </script>
  <script src="vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.editor.create(document.getElementById('editor'), {
        value: [
          '// Welcome to Void SuperCode',
          '// Start coding here...',
          '',
          'function hello() {',
          "  console.log('Hello, World!');",
          '}',
          '',
          'hello();',
          ''
        ].join('\n'),
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: true },
        scrollBeyondLastLine: false,
        tabSize: 2,
      });
    });
  </script>
</body>
</html>
